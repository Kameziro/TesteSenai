<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/Styles/formAdm.css">
    <script defer src="./index.js"></script>
</head>
<body>
    <div class="container">
        <a href="/index.html">&#8592 Voltar</a>
        <img src="/assets/f9b3a5180a879b555b4e5c9264ac2541.png" alt="logo">
        <div class="container-form">
        <form id="form" action="/">
            <h1>Fazer login como Administrador</h1>
            <div class="input-control">
                <label for="cpf">CPF</label>
                <input id="cpf" name="cpf" type="text">
                <div class="error"></div>
            </div>
            <div class="input-control">
                <label for="senha">Senha</label>
                <input id="senha"name="senha" type="password">
                <div class="error"></div>
            </div>
        </div>
        <button type="submit">Fazer Login</button>
        </form>
    </div>
    <script src="/src/js/validacaoAdm.js"></script>
</body>
</html>
